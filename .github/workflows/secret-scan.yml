name: secret-scan

# Detection alarm — NOT a required status check, NOT a merge gate.
# The local pre-commit hook is the prevention layer. This workflow exists
# so a personal-data / secret leak that slips past the hook is caught
# within minutes on push. Findings are reported, never block the pipeline.

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks + hex sanitize (non-blocking)
    runs-on: ubuntu-latest
    # Detection alarm: never fail the push pipeline on findings.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (report-only)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Run hex sanitize (report-only)
        continue-on-error: true
        run: |
          cargo run -p hex-harness -- sanitize || echo "::warning::hex sanitize reported findings (non-blocking)"
