name: secret-scan

# Detection alarm — NOT a required status check, NOT a merge gate.
# The local pre-commit hook is the prevention layer. This workflow exists
# so a personal-data / secret leak that slips past the hook is caught
# within minutes on push. Findings are reported, never block the pipeline.
# See ~/hex/docs/superpowers/specs/2026-06-06-release-pipeline-design.md (S1).

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks + sanitize-check (non-blocking)
    runs-on: ubuntu-latest
    # Detection alarm: never fail the push pipeline on findings.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (report-only)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Run sanitize-check.sh (report-only)
        continue-on-error: true
        run: |
          if [ -x system/scripts/sanitize-check.sh ]; then
            bash system/scripts/sanitize-check.sh || echo "::warning::sanitize-check.sh reported findings (non-blocking)"
          else
            echo "::warning::system/scripts/sanitize-check.sh not found or not executable"
          fi
