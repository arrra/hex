<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hex</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #faf8f4;
    color: #1a1816;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: 3rem 2.5rem 6rem;
    max-width: 640px;
  }

  .pulse {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4a8c3a;
    margin-right: 0.6rem;
    vertical-align: middle;
    animation: breathe 2.5s ease-in-out infinite;
  }
  .pulse.off { background: #c44; animation: none; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .header {
    margin-bottom: 2.5rem;
  }
  .header h1 {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #8a8078;
  }

  .now {
    margin-bottom: 3rem;
  }
  .now-empty {
    color: #a09890;
    font-size: 0.95rem;
  }

  .item {
    padding: 1rem 0;
    border-bottom: 1px solid #ece8e0;
  }
  .item:first-child { padding-top: 0; }
  .item:last-child { border-bottom: none; }

  .item-name {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 0.15rem;
  }

  .item-detail {
    font-size: 0.85rem;
    color: #6e695f;
  }

  .bar-track {
    margin-top: 0.5rem;
    height: 3px;
    background: #ece8e0;
    border-radius: 2px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: #b85c14;
    border-radius: 2px;
    transition: width 0.6s ease-out;
  }

  .section-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #b0a898;
    margin-bottom: 0.6rem;
  }

  .done-list {
    margin-bottom: 2rem;
  }
  .done-item {
    padding: 0.45rem 0;
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    font-size: 0.9rem;
    color: #6e695f;
    border-bottom: 1px solid #f0ece6;
  }
  .done-item:last-child { border-bottom: none; }
  .done-mark {
    color: #4a8c3a;
    font-weight: 600;
    flex-shrink: 0;
  }
  .done-mark.fail {
    color: #a13b3b;
  }
  .done-name { flex: 1; }
  .done-ago {
    font-size: 0.78rem;
    color: #b0a898;
    flex-shrink: 0;
  }

  .footer {
    margin-top: 3rem;
    font-size: 0.78rem;
    color: #c4beb4;
  }
</style>
</head>
<body>

<div class="header">
  <h1><span class="pulse" id="pulse"></span>hex</h1>
</div>

<div class="now" id="now">
  <div class="now-empty">Nothing running.</div>
</div>

<div id="done"></div>

<div class="footer" id="footer"></div>

<script>
let last = null;

function clean(entry) {
  const raw = entry.original_spec_path || entry.spec_path || '';
  let name = raw.split('/').pop().replace(/\.spec\.md$|\.md$/, '');
  name = name
    .replace(/^\d{4}-\d{2}-\d{2}-?/, '')
    .replace(/-/g, ' ')
    .replace(/\b(hex|boi)\b/gi, '')
    .trim();
  if (!name) name = entry.id;
  return name.charAt(0).toUpperCase() + name.slice(1);
}

function ago(iso) {
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function currentTask(entry) {
  try {
    const pit = entry.pre_iteration_tasks;
    if (!pit) return null;
    const tasks = typeof pit === 'string' ? JSON.parse(pit) : pit;
    for (const tid of Object.keys(tasks)) {
      if (tasks[tid] !== 'DONE' && tasks[tid] !== 'SKIPPED') {
        let label = tid.replace(/^t-\d+:\s*/, '');
        if (label === tid) label = null;
        return label || tid;
      }
    }
  } catch {}
  return null;
}

function render(data) {
  last = data;
  const p = document.getElementById('pulse');
  p.classList.toggle('off', !!data.error);

  const entries = data.entries || [];
  const running = entries.filter(e =>
    e.status === 'running' || e.status === 'assigning' || e.status === 'requeued'
  );
  const queued = entries.filter(e =>
    e.status === 'queued' || e.status === 'pending'
  );
  const recent = entries
    .filter(e => ['completed','failed','canceled','needs_review'].includes(e.status))
    .sort((a, b) => {
      const ta = new Date(a.last_iteration_at || a.started_at || 0).getTime();
      const tb = new Date(b.last_iteration_at || b.started_at || 0).getTime();
      return tb - ta;
    })
    .slice(0, 10);

  const nowEl = document.getElementById('now');
  const all = [...running, ...queued];

  if (all.length === 0) {
    nowEl.innerHTML = '<div class="now-empty">Nothing running.</div>';
  } else {
    nowEl.innerHTML = all.map(e => {
      const name = clean(e);
      const isQueued = e.status === 'queued' || e.status === 'pending';
      const done = e.tasks_done || 0;
      const total = e.tasks_total || 1;
      const pct = Math.min(100, Math.round((done / total) * 100));
      const task = currentTask(e);
      const elapsed = ago(e.first_running_at || e.started_at);

      let detail = '';
      if (isQueued) {
        detail = 'Queued';
      } else {
        const parts = [];
        if (task) parts.push(task);
        parts.push(done + ' of ' + total + ' done');
        if (elapsed) parts.push(elapsed);
        detail = parts.join(' · ');
      }

      const bar = isQueued ? '' : `
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%"></div>
        </div>`;

      return `
        <div class="item">
          <div class="item-name">${esc(name)}</div>
          <div class="item-detail">${esc(detail)}</div>
          ${bar}
        </div>`;
    }).join('');
  }

  const doneEl = document.getElementById('done');
  if (recent.length === 0) {
    doneEl.innerHTML = '';
  } else {
    doneEl.innerHTML = `
      <div class="section-label">Recent</div>
      <div class="done-list">
        ${recent.map(e => {
          const name = clean(e);
          const ok = e.status === 'completed';
          const mark = ok ? '✓' : '✗';
          const cls = ok ? '' : ' fail';
          const t = ago(e.last_iteration_at || e.started_at);
          return `
            <div class="done-item">
              <span class="done-mark${cls}">${mark}</span>
              <span class="done-name">${esc(name)}</span>
              <span class="done-ago">${esc(t)}</span>
            </div>`;
        }).join('')}
      </div>`;
  }

  const s = data.summary || {};
  document.getElementById('footer').textContent =
    (s.completed || 0) + ' completed · ' + (s.failed || 0) + ' failed';
}

function connect() {
  const src = new EventSource('api/stream');
  src.onmessage = ev => {
    try { render(JSON.parse(ev.data)); } catch {}
  };
  src.onerror = () => {
    document.getElementById('pulse').classList.add('off');
    src.close();
    setTimeout(connect, 2000);
  };
}

setInterval(() => { if (last) render(last); }, 1000);
connect();
</script>

</body>
</html>
