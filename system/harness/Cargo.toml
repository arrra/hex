[package]
# Package renamed `hex` → `hex-harness` (2026-06-05) to disambiguate from the
# transitive `hex` ENCODING crate the baked-in iii engine pulls (cargo `-p hex`
# was ambiguous between the two). The binary and lib stay named `hex` (overrides
# below), so nothing user-facing or on-disk changes — you still run `hex`, and
# `hex::` imports still resolve.
name = "hex-harness"
# Source of truth for hex version. Bumped by release.sh; build.rs
# injects this via env!("CARGO_PKG_VERSION") at compile time.
version = "0.30.2"
edition = "2021"

# Keep the lib + bin named `hex` even though the package is `hex-harness`.
[lib]
name = "hex"
path = "src/lib.rs"

[[bin]]
name = "hex"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
shellexpand = "3"
glob = "0.3"
walkdir = "2"
sha2 = "0.10"
fs2 = "0.4"
rusqlite = { version = "0.31", features = ["bundled-full"] }
regex = "1"
sqlite-vec = "0.1"
# Tree-trim attempted (2026-05-21): `default-features = false, features = ["ort-download-binaries"]`
# broke the build — `TextEmbedding::try_new` is only available with default features enabled
# (error[E0599]: no function or associated item named `try_new` found for struct `TextEmbedding`).
# The image/codec stack is not separately feature-gated in fastembed 4. Keeping defaults.
fastembed = "4"
anyhow = "1"
ureq = { version = "2", features = ["json"] }
ulid = "1"
dirs = "5"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = "0.4"
# Lockstep with the baked-in engine: iii-sdk pinned to the mrap/hex-iii fork
# rev (0.19.0-next.2). The engine crate `iii` (added in a later step) path-depends
# on this same iii-sdk inside the fork, so cargo unifies them to ONE version — no
# 0.18/0.19 split. Bump all iii deps together (see iii-versions-in-lockstep decision).
iii-sdk = { git = "https://github.com/mrap/hex-iii", rev = "cbc21ca13e163a55071de277693bd43d2e62a35c" }
# The iii engine, baked in. Crate is named `iii` in the fork (engine/); imported
# as `iii_engine` for clarity at the callsite. default-features=false drops the
# rabbitmq/lapin queue adapter (the file-based builtin queue path doesn't need
# it). Same rev as iii-sdk above — lockstep, so the engine's path-dep iii-sdk and
# ours resolve to ONE version. Provides EngineBuilder for the in-process harness.
iii_engine = { package = "iii", git = "https://github.com/mrap/hex-iii", rev = "cbc21ca13e163a55071de277693bd43d2e62a35c", default-features = false }
libc = "0.2"

[features]
personal = []

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[profile.release]
strip = true
lto = true
