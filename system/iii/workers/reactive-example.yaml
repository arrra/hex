# hex-reactive-example — declarative iii worker config (event-triggered).
# Hosted by `hex iii worker run <this file>`. Demonstrates a STATE trigger:
# the job's command is invoked whenever iii state under the `boi` scope
# changes. The trigger event payload is delivered via the `III_EVENT`
# environment variable as a JSON string.
#
# This is the canonical example for building reactive hex operations on iii
# (the counterpart to the cron-only `memory-maintenance.yaml`).
worker_name: hex-reactive-example
jobs:
  - id: hex::reactive::on_boi_state
    command: [hex, echo-event]
    trigger:
      state:
        scope: boi
    description: React to any state change under the `boi` scope.
