name: c3-audit-completeness-daily
description: >
  C3 / M3 — run the audit-stream completeness collector daily. The Python
  script globs the main audit JSONL plus every per-agent worktree mirror,
  groups records by (agent, date), and emits one
  hex.c3.audit.completeness event per bucket within the last 24h. Failures
  surface via the on_failure handler (S6: no quiet failures).

provides:
  events:
    - hex.c3.audit.completeness
    - hex.policy.c3-audit-completeness-daily.failed

requires:
  events:
    - timer.tick.daily

rules:
  - name: c3-audit-completeness-daily
    trigger:
      event: timer.tick.daily
    rate_limit: 1/1d
    actions:
      - type: shell
        command: |
          export PATH="/opt/homebrew/bin:/usr/bin:/bin:$PATH"
          export HEX_DIR="${HEX_DIR:-$HOME/hex}"
          export HEX_ROOT="${HEX_ROOT:-$HEX_DIR}"
          python3 "$HEX_DIR/.hex/scripts/c3-audit-completeness.py" --days 1
        timeout: 300
        on_failure:
          - type: emit
            event: hex.policy.c3-audit-completeness-daily.failed
            source: "hex:c3-audit-completeness-daily"
