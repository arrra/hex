name: memory-consumption-floor
description: >
  Alert if 7-day memory recall consumption rate drops below 80%. Catches the V1
  pathology where retrieval ran but nothing was injected and nobody noticed.
  Plan 2 T17.
trigger: timer.tick.daily
when:
  - "{{ event.payload.hour }} == 4"
action:
  type: shell
  command: |
    export PATH="/opt/homebrew/bin:$PATH"
    rate=$("$HEX_DIR/.hex/bin/hex" memory eval --rate-only)
    awk -v r="$rate" 'BEGIN { exit (r+0 < 0.80) ? 0 : 1 }' && {
      "$HEX_DIR/.hex/bin/hex" agent message --from cos --to me \
        --subject "Memory consumption rate dropped to $rate" \
        --body "Below the 0.80 floor. Inspect .hex/memory/recall-log.jsonl. If memory is intentionally quiet (no real work in the window) this can be dismissed; otherwise something is gating or failing in recall."
    }
