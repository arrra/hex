name: c3-ttd-tracker
description: >
  C3 / M4 — time-to-detect (TTD) state-machine tracker. Fired every 5
  minutes by timer.tick.5m. The Python collector reads events.db forward
  of its persisted watermark, opens incidents on failure patterns
  (hex.alert.error / hex.alert.critical / hex.policy.*.failed /
  hex.boi.integrity.violation), closes them on matching clean signals,
  emits hex.c3.ttd.sample on close, and flips any incident open >24h to
  status='still_open_24h'. Cold-start emits hex.c3.ttd.bootstrap so the
  operator can see the tracker initialised. Per S6 the script exits
  non-zero on hex-emit / sqlite failures and the on_failure handler
  surfaces hex.policy.c3-ttd-tracker.failed.

provides:
  events:
    - hex.c3.ttd.bootstrap
    - hex.c3.ttd.sample
    - hex.policy.c3-ttd-tracker.failed

requires:
  events:
    - timer.tick.5m

rules:
  - name: c3-ttd-tracker-5m
    trigger:
      event: timer.tick.5m
    rate_limit: 1/5m
    actions:
      - type: shell
        command: |
          export PATH="/opt/homebrew/bin:/usr/bin:/bin:$PATH"
          export HEX_DIR="${HEX_DIR:-$HOME/hex}"
          export HEX_ROOT="${HEX_ROOT:-$HEX_DIR}"
          python3 "$HEX_DIR/.hex/scripts/c3-ttd-tracker.py"
        timeout: 120
        on_failure:
          - type: emit
            event: hex.policy.c3-ttd-tracker.failed
            source: "hex:c3-ttd-tracker"
