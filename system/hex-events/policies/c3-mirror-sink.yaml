name: c3-mirror-sink
description: |
  C3 mirror sink — emit one JSONL line per action_log row to
  ~/.hex-events/mirror/YYYY-MM-DD.jsonl per the AMENDED mirror-sink contract
  (docs/superpowers/specs/2026-05-24-iii-hex-mirror-sink-contract.md).

  This is the canonical C3 "what actually happened" stream. Fires on ANY
  event (event:'*') so the producer drains the action_log on every bus
  movement. The script itself reads action_log past the watermark, writes
  one JSONL line per row, and atomically advances the watermark file.

  Different output directory than events-telemetry-mirror.sh — that one
  writes to .hex/telemetry/events.jsonl; this one writes to
  ~/.hex-events/mirror/. No coordination collision per V0.28.

provides:
  events:
    - hex.policy.c3-mirror-sink.failed

requires:
  events:
    - "*"

rate_limit:
  max_fires: 2000
  window: 60m

rules:
  - name: drain-action-log-to-jsonl
    trigger:
      event: "*"
    actions:
      - type: shell
        command: |
          export PATH="/opt/homebrew/bin:/usr/bin:/bin:$PATH"
          HEX_DIR="${HEX_DIR:-$HOME/hex}"
          python3 "$HEX_DIR/.hex/scripts/c3-mirror-sink.py"
        timeout: 30
        on_failure:
          - type: emit
            event: hex.policy.c3-mirror-sink.failed
            source: "hex:c3-mirror-sink"
          - type: shell
            command: 'echo "[POLICY FAIL] c3-mirror-sink: $HEX_EVENT_ERROR" >&2'
