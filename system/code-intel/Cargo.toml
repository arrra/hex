[package]
name = "scipd"
version = "0.1.0"
edition = "2021"

[lib]
name = "scipd_core"
path = "src/lib.rs"

[[bin]]
name = "cq"
path = "src/bin/cq.rs"

[[bin]]
name = "scipd"
path = "src/bin/scipd.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled-full"] }
sha2 = "0.10"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
# SCIP protobuf bindings (spec §9). Plan guessed 0.5; crates.io latest stable is
# 0.8.1 (checked 2026-06-11). Pinned exact per spec. Task 5 consumes it.
scip = "=0.8.1"
# scip's generated types implement protobuf::Message; we need the trait in
# scope to parse. Pinned to the exact version scip 0.8.1 depends on.
protobuf = "=3.7.2"
toml = "0.8"
# scipd daemon: SIGTERM clean-shutdown flag (SPEC-A2; std-thread design, no tokio)
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

# Deny raw string indexing (`s[a..b]`) that panics on non-char-boundary offsets.
# Every slice of a string that may carry non-ASCII (file content, paths, symbol
# names, model/git/JSON data) must use a boundary-safe form (get/chars/split_at_checked)
# or carry a targeted #[allow] with a proof that the offset is ASCII by construction.
[lints.clippy]
string_slice = "warn"
